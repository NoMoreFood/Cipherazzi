[package]
name = "cipherazzi-rustls"
version = "0.1.0"
edition = "2024"
publish = false

[features]
async = ["dep:tokio", "dep:tokio-rustls"]
quic = []

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
serde_json = "1.0.154"
base64 = "0.23.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_Cryptography"] }
tokio = { version = "1.53.3", features = ["net", "io-util", "rt"], optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, optional = true }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[[example]]
name = "client"
path = "../../tests/clients/RustlsClient.rs"

[[example]]
name = "native"
path = "../../tests/clients/RustlsNative.rs"

[[example]]
name = "native_quic"
path = "../../tests/clients/RustlsQuicNative.rs"
required-features = ["async"]

[[example]]
name = "quic_report"
path = "../../tests/clients/RustlsQuicReport.rs"
required-features = ["quic"]
